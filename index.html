<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sushi Warsztat</title><style>*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#090f16;color:#f5f4e9;font-family:system-ui,sans-serif}body{display:grid;place-items:center}.game{position:relative;width:min(543px,100vw,100dvh);height:min(543px,100vw,100dvh);container-type:inline-size;overflow:hidden;border-radius:19px;box-shadow:0 24px 80px #0009}canvas{display:block;width:100%;height:100%;touch-action:none}header{position:absolute;top:3.1cqw;left:3.8cqw;right:3.8cqw;display:flex;justify-content:space-between;align-items:center;gap:1cqw}small{font-size:1.5cqw;letter-spacing:.18em;color:#d0bb9d}h1{font-size:4.1cqw;letter-spacing:-.04em;margin:0}.headBtns{display:flex;gap:.8cqw}button{border:1px solid #c8b89944;border-radius:8px;background:#59625d;color:#f8f2df;font:700 1.75cqw system-ui;padding:1.3cqw 1.5cqw;cursor:pointer;touch-action:none;user-select:none}button:hover{filter:brightness(1.15)}button:disabled{opacity:.45;cursor:default}.hud{position:absolute;top:13.5cqw;left:4cqw;right:4cqw;display:flex;justify-content:space-between;font-size:1.95cqw;color:#d4d8cd}#status{color:#e4c58f}#notice{position:absolute;top:19.2cqw;left:3.3cqw;right:3.3cqw;text-align:center;font-size:1.9cqw;color:#e0d5c1}.controls{position:absolute;left:4cqw;right:4cqw;bottom:4.5cqw;display:flex;gap:1.3cqw}.controls button{height:6.4cqw;flex:1;font-size:2.1cqw;padding:1cqw}#action{background:#e5cc93;color:#343d37}.suggested{outline:2px solid #fff2a5}.foot{position:absolute;bottom:.9cqw;left:4cqw;right:4cqw;display:flex;justify-content:space-between;align-items:center;font-size:1.55cqw;color:#a7b6b1}#reset{padding:0;border:0;background:transparent;color:#c0cbc2;font-size:1.55cqw}#panel{position:absolute;top:24cqw;bottom:17cqw;left:9cqw;right:9cqw;background:#142b35f7;border:1px solid #b7b99c66;border-radius:18px;backdrop-filter:blur(8px);padding:5cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}#panelTitle{font-size:5.2cqw;line-height:1.12;margin:0 0 3cqw}#panelText{font-size:2.7cqw;line-height:1.6;color:#d4dbce;margin:0 0 4cqw}#start{width:100%;font-size:2.8cqw;padding:2.2cqw;background:#e5ce99;color:#30443c}.icon{font-size:6.5cqw;color:#e5ce99;margin-bottom:2cqw}</style><main class="game"><canvas id="c" width="543" height="543" tabindex="0" aria-label="Kuchnia 2D z góry"></canvas><header><div><small>KITCHEN ATELIER / 02</small><h1>Sushi Warsztat</h1></div><div class="headBtns"><button id="hint">Pomoc</button><button id="pause">Pauza</button><button id="restart">Nowa zmiana</button></div></header><div class="hud"><span id="progress"></span><span id="status"></span><span id="best"></span></div><div id="notice"></div><div class="controls"><button id="extra">Wyczyść stół</button><button id="action">Gotuj</button></div><div class="foot"><span>Klikaj lub przeciągaj • H: pomoc • P: pauza</span><button id="reset">Reset rekordu</button></div><div id="panel"><div class="icon">✦ ♡ ✦</div><h2 id="panelTitle"></h2><p id="panelText"></p><button id="start">Zacznij gotować</button></div></main><script>const MODE=1,TITLE="Sushi Warsztat",$=id=>document.getElementById(id),cv=$('c'),c=cv.getContext('2d'),A={x:20,y:126,w:503,h:324};const PIZZA=['Sos','Ser','Pomidor','Pieczarki','Oliwki','Bazylia'],SUSHI=['Ryż','Łosoś','Ogórek','Awokado','Sezam'],SAUCES=['Jagody','Czekolada','Miód'];let state='menu',paused=false,score=0,best=0,done=0,bad=0,age=0,phase='prep',recipes=[],sauce=false,cheese=false,toppings=[],ovenTime=0,bakeQuality=0,rice=false,fillings=[],sesame=false,cuts=0,pans=[],plated=null,chosenTopping=0,cool=0,slow=0,drag=null,hintKey=null,hintTime=0,toast='',toastTime=0,seed=71,serial=0;try{best=+localStorage.getItem('kitchen-top-'+MODE)||0}catch(e){}const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);function rand(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function say(t){toast=t;toastTime=3;syncHUD()}function record(){best=Math.max(best,score);try{localStorage.setItem('kitchen-top-'+MODE,best)}catch(e){}}function finish(result){state=result;record();sync()}
function pizzaReset(){phase='prep';sauce=false;cheese=false;toppings=[];ovenTime=0;bakeQuality=0}function sushiReset(){phase='prep';rice=false;fillings=[];sesame=false;cuts=0}
function start(){serial++;seed=(Date.now()^Math.imul(serial,7193)^MODE*911)>>>0;state='playing';paused=false;score=0;done=0;bad=0;age=0;toast='';toastTime=0;hintKey=null;hintTime=0;drag=null;cool=0;slow=0;plated=null;chosenTopping=0;if(MODE===0){recipes=shuffle([[2,3],[2,4],[2,5],[3,4],[3,5],[4,5]]).slice(0,4);recipes.push(shuffle([2,3,4,5]).slice(0,3));pizzaReset()}if(MODE===1){recipes=shuffle([[1,2],[1,3],[2,3],[1,2]]);sushiReset()}if(MODE===2){recipes=shuffle([0,1,2,0,1,2]);pans=[{x:224,y:249,side:0,time:0,quality:0},{x:410,y:249,side:0,time:0,quality:0}];phase='frying'}sync();render()}
function fail(message){bad++;say(message);if(bad>=3&&MODE!==1)finish('lost')}
function same(a,b){return a.slice().sort().join(',')===b.slice().sort().join(',')}
function ingredient(i){if(state!=='playing'||paused)return;hintKey=null;if(MODE===0){if(phase!=='prep'){say('Najpierw zakończ pieczenie lub podaj pizzę.');return}if(i===0)sauce=true;else if(i===1){if(!sauce){say('Najpierw rozprowadź sos.');return}cheese=true}else{if(!cheese){say('Dodaj najpierw sos i ser.');return}let j=toppings.indexOf(i);if(j>=0)toppings.splice(j,1);else toppings.push(i)}say(PIZZA[i]+': dodano lub zmieniono składnik.')}if(MODE===1){if(phase!=='prep'){say('Rolka jest już zwinięta. Teraz ją pokrój.');return}if(i===0)rice=true;else{if(!rice){say('Najpierw rozłóż ryż na nori.');return}if(i===4)sesame=!sesame;else{let j=fillings.indexOf(i);if(j>=0)fillings.splice(j,1);else fillings.push(i)}}say(SUSHI[i]+': składnik gotowy.')}syncHUD()}
function oven(){if(state!=='playing'||paused)return;if(phase==='prep'){if(!sauce||!cheese||!same(toppings,recipes[done])){say('Sprawdź przepis: potrzebne są sos, ser i dokładnie wskazane dodatki.');return}phase='baking';ovenTime=0;say('Pizza w piecu. Wyjmij ją, gdy pasek będzie zielony.')}else if(phase==='baking'){if(ovenTime<3){say('Jeszcze chwila — pizza potrzebuje co najmniej 3 sekund.');return}phase='ready';bakeQuality=Math.max(0,50-Math.round(Math.abs(ovenTime-4)*20));say('Pizza upieczona. Teraz kliknij Podaj pizzę.')}else if(phase==='ready'){score+=100+bakeQuality;done++;if(done>=5)finish('won');else{pizzaReset();say('Podano! Przygotuj następną pizzę.')}}syncHUD()}
function roll(){if(state!=='playing'||paused||phase!=='prep')return;if(!rice||!same(fillings,recipes[done])){bad++;say('Dopasuj dwa składniki do przepisu, zanim zwiniesz rolkę.');return}phase='cut';cuts=0;say('Rolka gotowa. Krój po kreskach od lewej do prawej.');syncHUD()}
function cut(i){if(state!=='playing'||paused||phase!=='cut')return;if(i!==cuts){bad++;say('Zacznij od pierwszej niewykonanej kreski po lewej.');return}cuts++;if(cuts===5){phase='sliced';say('Sześć kawałków gotowych. Kliknij Podaj sushi.')}else say('Dobre cięcie! '+cuts+'/5');syncHUD()}
function serveSushi(){if(state!=='playing'||paused||phase!=='sliced')return;score+=Math.max(40,100-bad*2)+(sesame?10:0);done++;if(done>=4)finish('won');else{sushiReset();say('Sushi podane! Przygotuj następną rolkę.')}syncHUD()}
function panClick(i){if(state!=='playing'||paused)return;let p=pans[i];hintKey=null;if(p.side===0){p.side=1;p.time=0;p.quality=0;say('Ciasto na patelni. Czekaj na zielony pasek.')}else if(p.side===1){if(p.time<2.2){say('Jeszcze za wcześnie na obracanie.');return}p.quality=Math.max(0,25-Math.round(Math.abs(p.time-3)*8));p.side=2;p.time=0;say('Odwrócono! Usmaż drugą stronę.')}else{if(p.time<1.6){say('Druga strona jeszcze się smaży.');return}if(plated){say('Najpierw podaj naleśnik z talerza.');return}plated={topping:-1,quality:p.quality+Math.max(0,25-Math.round(Math.abs(p.time-2.4)*8))};p.side=0;p.time=0;say('Gotowy naleśnik czeka na zamówioną polewę.')}syncHUD()}
function topping(i){if(state!=='playing'||paused)return;if(!plated){say('Najpierw usmaż naleśnik i przełóż go na talerz.');return}chosenTopping=i;plated.topping=i;say('Dodano: '+SAUCES[i]+'. Kliknij Podaj.');syncHUD()}
function servePancake(){if(state!=='playing'||paused||!plated)return;if(plated.topping!==recipes[done]){say('Gość zamówił: '+SAUCES[recipes[done]]+'. Zmień polewę.');return}score+=100+plated.quality;plated=null;done++;if(done>=6)finish('won');else say('Podano! Następny dodatek: '+SAUCES[recipes[done]]+'.');syncHUD()}
function action(){if(MODE===0)oven();if(MODE===1){if(phase==='prep')roll();else if(phase==='sliced')serveSushi()}if(MODE===2)servePancake()}
function extra(){if(state!=='playing'||paused)return;if(MODE===0){if(phase!=='prep')return;pizzaReset();say('Deska gotowa na nowe składniki.')}if(MODE===1){sushiReset();say('Przygotuj tę rolkę od początku.')}if(MODE===2&&cool<=0){slow=4;cool=15;say('Spokojne pieczenie: patelnie nagrzewają się wolniej przez 4 sekundy.')}syncHUD()}
function hint(){if(state!=='playing'||paused)return;hintTime=6;if(MODE===0){if(phase==='prep'){let i=!sauce?0:!cheese?1:recipes[done].find(i=>!toppings.includes(i));if(i===undefined){let wrong=toppings.find(i=>!recipes[done].includes(i));i=wrong}hintKey=i===undefined?{type:'action'}:{type:'ingredient',i};say(i===undefined?'Składniki pasują. Włącz piec.':'Kliknij podświetlony składnik; ponowne kliknięcie dodatku go usuwa.')}else{hintKey={type:'action'};say(phase==='ready'?'Podaj gotową pizzę.':'Wyjmij pizzę po 3 sekundach i przed końcem 6. sekundy.')}}if(MODE===1){if(phase==='prep'){let i=!rice?0:recipes[done].find(i=>!fillings.includes(i));if(i===undefined)i=fillings.find(i=>!recipes[done].includes(i));hintKey=i===undefined?{type:'action'}:{type:'ingredient',i};say(i===undefined?'Zwiń rolkę przyciskiem lub gestem od dołu w górę.':'Dodaj lub usuń podświetlony składnik.')}else if(phase==='cut'){hintKey={type:'cut',i:cuts};say('Kliknij lub przetnij podświetloną kreskę.')}else{hintKey={type:'action'};say('Podaj gotowe sushi.')}}if(MODE===2){if(plated){hintKey=plated.topping===recipes[done]?{type:'action'}:{type:'topping',i:recipes[done]};say('Dopasuj polewę z przepisu i podaj naleśnik.')}else{let i=pans.findIndex(p=>p.side>0);if(i<0)i=0;hintKey={type:'pan',i};say('Klikaj patelnię w zielonym zakresie: najpierw obróć, potem zdejmij.')}}syncHUD()}
function update(dt){if(state!=='playing'||paused)return;age+=dt;toastTime=Math.max(0,toastTime-dt);hintTime=Math.max(0,hintTime-dt);cool=Math.max(0,cool-dt);slow=Math.max(0,slow-dt);if(hintTime===0)hintKey=null;if(MODE===0&&phase==='baking'){ovenTime+=dt;if(ovenTime>6){pizzaReset();fail('Pizza się przypaliła. Zrób nową dla tego zamówienia.')}}if(MODE===2){for(let p of pans)if(p.side>0){p.time+=dt*(slow>0?.5:1);if(p.time>(p.side===1?4.6:4.2)){p.side=0;p.time=0;fail('Naleśnik się przypalił. Zacznij od nowego ciasta.');if(state!=='playing')break}}}syncHUD()}
function syncHUD(){let goal=MODE===0?5:MODE===1?4:6;$('progress').textContent='PODANO '+done+'/'+goal;$('status').textContent=MODE===1?(bad===0?'★ ★ ★':bad<=4?'★ ★ ☆':'★ ☆ ☆'):'♥ '.repeat(Math.max(0,3-bad));$('best').textContent='REKORD '+best;let r=recipes[done];$('notice').textContent=toastTime>0?toast:r!==undefined?(MODE===0?'Przepis: sos + ser + '+r.map(i=>PIZZA[i]).join(' + '):MODE===1?'Przepis: ryż + '+r.map(i=>SUSHI[i]).join(' + '):'Zamówienie: naleśnik • '+SAUCES[r]):'Wszystkie zamówienia gotowe!';$('action').textContent=MODE===0?(phase==='prep'?'Piecz pizzę':phase==='baking'?'Wyjmij z pieca':'Podaj pizzę'):MODE===1?(phase==='prep'?'Zwiń rolkę':phase==='cut'?'Krój po kreskach':'Podaj sushi'):'Podaj naleśnik';$('action').disabled=state!=='playing'||paused||MODE===1&&phase==='cut'||MODE===2&&!plated;$('action').classList.toggle('suggested',hintKey?.type==='action');$('extra').textContent=MODE===2?'Spokojne pieczenie'+(cool>0?' '+cool.toFixed(1)+' s':''):'Wyczyść stół';$('extra').disabled=state!=='playing'||paused||MODE===0&&phase!=='prep'||MODE===2&&cool>0;$('hint').disabled=state!=='playing'||paused}
function sync(){syncHUD();$('pause').textContent=paused?'Wznów':'Pauza';$('pause').disabled=state!=='playing';$('panel').style.display=['menu','won','lost'].includes(state)?'flex':'none';$('panelTitle').textContent=state==='menu'?TITLE:state==='won'?'Pyszna robota!':'Spróbuj ponownie';$('panelText').textContent=state==='menu'?"Przygotuj 4 rolki sushi. Dodaj ry\u017c i dwa sk\u0142adniki z przepisu, zwi\u0144 rolk\u0119 gestem lub przyciskiem, a nast\u0119pnie wykonaj 5 ci\u0119\u0107 od lewej. Klikanie kresek te\u017c dzia\u0142a.":state==='won'?`Wszystkie zamówienia podane! Wynik: ${score} pkt. Rekord: ${best}.`: 'Trzy przypalenia zakończyły zmianę. Obserwuj zielony zakres i korzystaj z pauzy.';$('start').textContent=state==='menu'?'Zacznij gotować':'Nowa zmiana'}
function circle(x,y,r,col,stroke){c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,7);c.fill();if(stroke){c.strokeStyle=stroke;c.lineWidth=2;c.stroke()}}function rect(x,y,w,h,r,col,stroke){c.beginPath();c.roundRect(x,y,w,h,r);c.fillStyle=col;c.fill();if(stroke){c.strokeStyle=stroke;c.lineWidth=2;c.stroke()}}
function ingredientIcon(i,x,y,s=1){c.save();c.translate(x,y);c.scale(s,s);let k=MODE===0?i:MODE===1?i+10:i+20;if(k===0){circle(0,2,15,'#e5c3a2');circle(0,0,11,'#d58a75');c.strokeStyle='#b27564';c.lineWidth=3;c.beginPath();c.moveTo(4,-5);c.lineTo(13,-17);c.stroke()}if(k===1){c.fillStyle='#eed693';c.beginPath();c.moveTo(-16,11);c.lineTo(-11,-12);c.lineTo(17,6);c.closePath();c.fill();circle(-5,1,3,'#d1b374');circle(4,6,2,'#d1b374')}if(k===2){circle(0,0,15,'#d8837c','#bd756c');for(let j=0;j<5;j++){let a=j*Math.PI*2/5;c.fillStyle='#f1b69a';c.beginPath();c.ellipse(Math.cos(a)*7,Math.sin(a)*7,4,2,a,0,7);c.fill()}}if(k===3){rect(-4,-2,9,17,3,'#dfd3b6');c.fillStyle='#b9a58c';c.beginPath();c.arc(0,-1,17,Math.PI,Math.PI*2);c.closePath();c.fill();circle(-7,-8,3,'#e7d8bc');circle(6,-11,2,'#e7d8bc')}if(k===4){circle(0,0,15,'#62745e');circle(0,0,7,'#b6c49a')}if(k===5||k===12||k===13){c.fillStyle=k===5?'#86a46d':k===12?'#9eb57d':'#a8b98b';c.beginPath();c.ellipse(0,0,17,9,-.4,0,7);c.fill();c.strokeStyle='#5e866b';c.lineWidth=2;c.beginPath();c.moveTo(-13,5);c.lineTo(13,-5);c.stroke();if(k===13){circle(0,0,7,'#dbc285');circle(0,0,4,'#9c9061')}}if(k===10){circle(0,4,18,'#c7a784');c.fillStyle='#f2edda';c.beginPath();c.ellipse(0,-1,16,10,0,0,7);c.fill();for(let j=0;j<8;j++){c.fillStyle='#d8d7bd';c.fillRect(-9+j%4*6,-5+(j/4|0)*6,3,1)}}if(k===11){rect(-18,-10,36,20,6,'#e9a188');c.strokeStyle='#f9d1b3';c.lineWidth=2;for(let j=-10;j<14;j+=7){c.beginPath();c.moveTo(j,-8);c.lineTo(j-4,8);c.stroke()}}if(k===14){circle(0,0,15,'#d9c391');for(let j=0;j<8;j++){c.fillStyle='#f2dfb2';c.beginPath();c.ellipse(-9+j%4*6,-6+(j/4|0)*10,3,1.4,j,0,7);c.fill()}}if(k>=20){circle(0,0,17,['#978aaa','#9c7b65','#e3c686'][k-20]);if(k===20)for(let [xx,yy] of [[-6,-2],[5,-5],[1,6]])circle(xx,yy,5,'#716682');if(k===21){c.strokeStyle='#d2b693';c.lineWidth=3;c.beginPath();c.moveTo(-10,-6);c.lineTo(10,6);c.moveTo(-9,5);c.lineTo(10,-5);c.stroke()}if(k===22){c.fillStyle='#f1dea5';c.beginPath();c.ellipse(0,0,9,5,-.5,0,7);c.fill()}}c.restore()}
function chef(x,y){circle(x,y+10,12,'#8a765633');rect(x-7,y+1,14,20,5,'#dae2cd');circle(x,y-7,9,'#e8be94');circle(x-6,y-17,7,'#f5edda');circle(x+6,y-17,7,'#f5edda');circle(x,y-21,8,'#f8f0dd');rect(x-9,y-16,18,9,3,'#f5edda')}
function pizza(x,y,r=80){circle(x,y,r,'#d3aa71','#b89165');circle(x,y,r-8,sauce?'#cc8c77':'#e6cc94');if(cheese){circle(x,y,r-15,'#e8c985');for(let j=0;j<30;j++){let a=j*2.4,rr=(j%7+1)/8*(r-20);circle(x+Math.cos(a)*rr,y+Math.sin(a)*rr,2,'#f6dfaa')}}for(let k=0;k<toppings.length;k++)for(let j=0;j<5;j++){let a=j*1.256+k*.7,rr=(.35+k*.15)*(r-14);ingredientIcon(toppings[k],x+Math.cos(a)*rr,y+Math.sin(a)*rr,r/80*.5)}}
